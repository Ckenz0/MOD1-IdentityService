name: Publish API to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_revision:
        description: 'Update an existing Container App after publishing the image'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: azure-demo-api
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_REPOSITORY: identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.24'
          enable-cache: true
      - name: Lint and type-check Python
        run: |
          uv sync --locked
          uv run --locked python -m ruff check .
          uv run --locked python -m ruff format --check .
          uv run --locked python -m mypy src/mod1_auth examples/validate_token.py
      - name: Run automated tests
        run: uv run --locked python -m pytest -q
      - name: Audit locked dependencies
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt" --quiet
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --require-hashes --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Build and smoke with synthetic SQLite
        shell: bash
        run: |
          set -euo pipefail
          docker build --check .
          docker build --tag mod1-identity:check .
          container=$(docker run --detach --tmpfs /validation:rw,uid=10001,gid=10001 \
            --env DATABASE_URL=sqlite:////validation/smoke.db \
            --env JWT_ISSUER=https://smoke.invalid \
            --env JWT_PRIVATE_KEY_PATH=/validation/key.pem \
            --publish 127.0.0.1::8000 --entrypoint sh mod1-identity:check \
            -c 'python -m mod1_auth.cli init && exec uvicorn mod1_auth.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log')
          trap 'docker rm --force "$container" >/dev/null' EXIT
          endpoint="http://$(docker port "$container" 8000/tcp)"
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 10 "$endpoint/health/ready"
          docker exec "$container" python -c 'import os,pathlib; assert os.getuid()==10001; assert pathlib.Path("/etc/ssl/certs/ca-certificates.crt").is_file(); assert not any(pathlib.Path("/app", p).exists() for p in [".env", "AGENTS.md", "agents.md", ".superpowers", "superpowers"])'
      - name: Validate deployment names
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          [[ "$AZURE_RESOURCE_GROUP" =~ ^[A-Za-z0-9._-]{1,90}$ ]]
          [[ "$AZURE_CONTAINER_APP" =~ ^[a-z][a-z0-9-]{1,30}[a-z0-9]$ ]]
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2; OIDC, no client secret
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --output none
          image="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker tag "mod1-$IMAGE_REPOSITORY:check" "$image"
          docker push "$image"
          digest=$(az acr repository show --name "$ACR_NAME" --image "$IMAGE_REPOSITORY:$GITHUB_SHA" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          reference="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY@$digest"
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf 'Image: %s\nCode: %s\n' "$reference" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy and wait for the new revision
        if: github.event_name == 'push' || inputs.deploy_revision
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          revision=$(az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$IMAGE_REFERENCE" --query properties.latestRevisionName --output tsv)
          host=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          [[ "$host" =~ ^[a-z0-9.-]+\.azurecontainerapps\.io$ ]]
          for attempt in $(seq 1 60); do
            ready=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)
            if curl --fail --silent --show-error --max-time 15 "https://$host/health/ready" >/dev/null && [[ "$ready" == "$revision" ]]; then
              printf 'Ready revision: %s\nURL: https://%s\n' "$revision" "$host" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'New revision did not become ready; inspect Container Apps system logs.' >&2
          exit 1

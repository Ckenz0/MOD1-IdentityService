[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mod1-auth"
version = "0.3.0"
description = "Identidade e autenticacao do modulo 1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.2",
  "pyjwt[crypto]>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.6,<3", "python-multipart>=0.0.20,<0.1",
  "email-validator>=2.2,<3", "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.27,<1", "httpx2>=2,<3", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
mod1-auth = "mod1_auth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mod1_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/mod1_auth"]

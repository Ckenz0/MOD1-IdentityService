<rect x="60" y="37" width="8" height="92" rx="4" fill="#247BC3" stroke="#D6DFEB" stroke-width="1.4"/><text x="86" y="57" font-size="15" font-weight="650" text-anchor="start" fill="#52647D">MÓDULO 1  /  ARQUITETURA FINAL</text><text x="84" y="105" font-size="40" font-weight="700" text-anchor="start" fill="#152542">Identidade — arquitetura interna</text><text x="84" y="145" font-size="21" font-weight="400" text-anchor="start" fill="#52647D">Autenticação, sessões, credenciais e perfil profissional.</text><rect x="1690" y="35" width="170" height="33" rx="16.5" fill="#EAF3FC" stroke="#EAF3FC" stroke-width="1.4"/><text x="1775.0" y="57.5" font-size="15" font-weight="650" text-anchor="middle" fill="#247BC3">VERSÃO 0.4.0</text><text x="1860" y="1046" font-size="15" font-weight="600" text-anchor="end" fill="#52647D">FIGURA 02 / 05</text><text x="60" y="1046" font-size="17" font-weight="400" text-anchor="start" fill="#52647D">Microsserviços no conjunto · Multicamadas pragmática internamente</text><rect x="60" y="200" width="940" height="130" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="61" y="201" width="7" height="128" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="87" y="239" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="60,200,940,130">01  APRESENTAÇÃO · HTTP / FASTAPI</text><text x="87" y="276" font-size="20" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,200,940,130">api.py · identity_api.py</text><text x="87" y="305" font-size="20" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,200,940,130">HTTP de autenticação, sessões, MFA, perfis e administração</text><rect x="60" y="390" width="940" height="220" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="61" y="391" width="7" height="218" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="87" y="429" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="60,390,940,220">02  APLICAÇÃO · CASOS DE USO</text><text x="87" y="475" font-size="23" font-weight="650" text-anchor="start" fill="#247BC3" data-boundary="60,390,940,220">AuthService</text><text x="87" y="503" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,390,940,220">Login e credenciais de acesso</text><text x="542" y="475" font-size="23" font-weight="650" text-anchor="start" fill="#247BC3" data-boundary="60,390,940,220">IdentityService</text><text x="542" y="503" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,390,940,220">Sessões, refresh, revogação e bloqueios</text><text x="87" y="552" font-size="23" font-weight="650" text-anchor="start" fill="#247BC3" data-boundary="60,390,940,220">CredentialService</text><text x="87" y="580" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,390,940,220">MFA, recuperação e confirmação</text><text x="542" y="552" font-size="23" font-weight="650" text-anchor="start" fill="#247BC3" data-boundary="60,390,940,220">ProfileService</text><text x="542" y="580" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,390,940,220">Perfil e diretório consentido</text><rect x="60" y="680" width="440" height="210" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="61" y="681" width="7" height="208" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="87" y="719" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="60,680,440,210">03  DOMÍNIO</text><text x="87" y="767" font-size="20" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,680,440,210">Usuário e perfil profissional</text><text x="87" y="800" font-size="20" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,680,440,210">Valores, validações e erros</text><text x="87" y="833" font-size="20" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,680,440,210">Sem HTTP, ORM ou configuração</text><rect x="560" y="680" width="440" height="210" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="561" y="681" width="7" height="208" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="587" y="719" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="560,680,440,210">04  INFRAESTRUTURA</text><text x="587" y="756" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="560,680,440,210">Repositórios + SQLAlchemy</text><text x="587" y="787" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="560,680,440,210">JWT/JWKS · Argon2 · TOTP</text><text x="587" y="818" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="560,680,440,210">Criptografia de MFA · e-mail</text><text x="587" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="560,680,440,210">Transações e persistência</text><rect x="1100" y="200" width="760" height="130" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="1101" y="201" width="7" height="128" rx="3" fill="#1E2A5A" stroke="#1E2A5A" stroke-width="1.4"/><text x="1127" y="239" font-size="22" font-weight="700" text-anchor="start" fill="#1E2A5A" data-boundary="1100,200,760,130">COMPOSIÇÃO · TRANSVERSAL</text><text x="1127" y="276" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="1100,200,760,130">main.py · dependencies.py · cli.py</text><text x="1127" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="1100,200,760,130">Monta serviços, repositórios, clientes e configurações.</text><path class="edge" d="M1100,265 L1055,265 L1055,470 L1000,470" stroke="#1E2A5A" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="984.0" y="342" width="260" height="29" rx="6" fill="white" stroke="white" stroke-width="1.4"/><text x="1114" y="362" font-size="16" font-weight="550" text-anchor="middle" fill="#1E2A5A">Monta e injeta dependências</text><rect x="1100" y="390" width="760" height="220" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="1101" y="391" width="7" height="218" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="1127" y="429" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="1100,390,760,220">PERSISTÊNCIA E INTEGRAÇÕES</text><rect x="1127" y="452" width="7" height="39" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="1151" y="471" font-size="20" font-weight="650" text-anchor="start" fill="#247BC3" data-boundary="1100,390,760,220">PostgreSQL / Neon</text><text x="1151" y="496" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="1100,390,760,220">Schema exclusivo mod1_identity</text><rect x="1127" y="528" width="7" height="39" rx="3" fill="#C8102E" stroke="#C8102E" stroke-width="1.4"/><text x="1151" y="547" font-size="20" font-weight="650" text-anchor="start" fill="#C8102E" data-boundary="1100,390,760,220">Resend</text><text x="1151" y="572" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="1100,390,760,220">Entrega de recuperação e confirmação de e-mail</text><rect x="1100" y="680" width="760" height="210" rx="16" fill="white" stroke="#D6DFEB" stroke-width="1.4"/><rect x="1101" y="681" width="7" height="208" rx="3" fill="#247BC3" stroke="#247BC3" stroke-width="1.4"/><text x="1127" y="719" font-size="22" font-weight="700" text-anchor="start" fill="#247BC3" data-boundary="1100,680,760,210">FLUXO DE LOGIN E CRIAÇÃO DE SESSÃO</text><text x="1127" y="751" font-size="19" font-weight="400" text-anchor="start" fill="#152542" data-boundary="1100,680,760,210">01  Receber e validar e-mail e senha</text><text x="1127" y="780" font-size="19" font-weight="400" text-anchor="start" fill="#152542" data-boundary="1100,680,760,210">02  Consultar usuário e verificar Argon2</text><text x="1127" y="809" font-size="19" font-weight="400" text-anchor="start" fill="#152542" data-boundary="1100,680,760,210">03  Exigir segundo fator quando habilitado</text><text x="1127" y="838" font-size="19" font-weight="400" text-anchor="start" fill="#152542" data-boundary="1100,680,760,210">04  Persistir sessão e credencial de renovação</text><text x="1127" y="867" font-size="19" font-weight="400" text-anchor="start" fill="#152542" data-boundary="1100,680,760,210">05  Responder com JWT RS256 e refresh opaco</text><path class="edge" d="M530,330 L530,390" stroke="#247BC3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415.0" y="341" width="230" height="29" rx="6" fill="white" stroke="white" stroke-width="1.4"/><text x="530" y="361" font-size="17" font-weight="550" text-anchor="middle" fill="#247BC3">Chama casos de uso</text><path class="edge" d="M280,610 L280,680" stroke="#247BC3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="157.5" y="627" width="245" height="29" rx="6" fill="white" stroke="white" stroke-width="1.4"/><text x="280" y="647" font-size="17" font-weight="550" text-anchor="middle" fill="#247BC3">Usa modelos e regras</text><path class="edge" d="M780,610 L780,680" stroke="#247BC3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="630.0" y="627" width="300" height="29" rx="6" fill="white" stroke="white" stroke-width="1.4"/><text x="780" y="647" font-size="16" font-weight="550" text-anchor="middle" fill="#247BC3">Usa repositórios / adaptadores</text><path class="edge" d="M560,804 L500,804" stroke="#52647D" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="786" font-size="13" font-weight="450" text-anchor="middle" fill="#52647D">modelos</text><path class="edge" d="M1000,833 L1055,833 L1055,520 L1100,520" stroke="#157A78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="986.0" y="625" width="138" height="29" rx="6" fill="white" stroke="white" stroke-width="1.4"/><text x="1055" y="645" font-size="15" font-weight="550" text-anchor="middle" fill="#157A78">SQL / HTTPS</text><rect x="60" y="929" width="1800" height="80" rx="12" fill="#EAF3FC" stroke="#EAF3FC" stroke-width="1.4"/><text x="85" y="959" font-size="20" font-weight="600" text-anchor="start" fill="#247BC3" data-boundary="60,929,1800,80">Domínio independente de FastAPI e banco. A aplicação utiliza repositórios e adaptadores concretos.</text><text x="85" y="988" font-size="18" font-weight="400" text-anchor="start" fill="#52647D" data-boundary="60,929,1800,80">JWT assinado com chave privada da Identidade; JWKS público para validação pelos consumidores.</text></svg>